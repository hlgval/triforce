name: Radar stock

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 minutes (heure UTC)
  workflow_dispatch: {}       # permet un lancement manuel depuis l'onglet Actions

permissions:
  contents: write   # nécessaire pour committer state.json

jobs:
  scruter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le radar
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python radar_stock.py

      - name: Committer l'état s'il a changé
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Mise à jour état stock"
          git push

